<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; media-src blob:; style-src 'self'; script-src 'self'">
  <title>Team Monitor — Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sb" id="sidebar">
      <div class="sb-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="12" rx="2" stroke="white" stroke-width="1.8"/>
            <path d="M8 21h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Team Monitor</div>
          <div class="brand-sub">Admin dashboard</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="nav-group">Main</div>
        <button type="button" class="nav-btn active" data-view="live" id="tab-live">Live grid</button>
        <div class="nav-group">Review</div>
        <button type="button" class="nav-btn" data-view="recordings" id="tab-recordings">Recordings</button>
        <button type="button" class="nav-btn" data-view="activity" id="tab-activity">Activity</button>
        <div class="nav-group">Setup</div>
        <button type="button" class="nav-btn" data-view="settings" id="tab-settings">Settings</button>
      </nav>
      <div class="sb-footer">
        <div class="user-card">
          <div class="user-avatar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M5 19c1.5-3.2 3.8-4.7 7-4.7s5.5 1.5 7 4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </div>
          <div>
            <div class="user-label">This PC</div>
            <div class="user-name" id="adminHost">Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <button type="button" class="sb-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="true" aria-label="Close sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="content">
        <main id="view-live">
          <div class="stats">
            <div class="stat"><div class="stat-label">Teammates</div><div class="stat-value" id="stat-total">0</div></div>
            <div class="stat green"><div class="stat-label">Online</div><div class="stat-value" id="stat-online">0</div></div>
            <div class="stat purple"><div class="stat-label">Recording</div><div class="stat-value" id="stat-rec">0</div></div>
            <div class="stat yellow"><div class="stat-label">Waiting to upload</div><div class="stat-value" id="stat-pending">0</div></div>
          </div>
          <div id="grid" class="ws-grid"></div>
        </main>

        <main id="view-recordings" hidden>
          <div class="filters">
            <label>Date <input id="rec-date" type="date"></label>
            <button type="button" class="quiet-btn" id="rec-prev">Previous day</button>
            <button type="button" class="quiet-btn" id="rec-next">Next day</button>
            <label>Teammate <select id="rec-member"></select></label>
            <div class="rec-displays" id="rec-display-switch"></div>
            <label>Time <input id="rec-time" type="time" lang="en-GB"></label>
          </div>
          <p id="rec-note" class="note"></p>
          <div class="rec-players" id="rec-players"></div>
          <div id="segments" class="rec-clips"></div>
        </main>

        <main id="view-activity" hidden>
          <div class="filters">
            <label>Date <input id="act-date" type="date"></label>
            <button type="button" class="quiet-btn" id="act-prev">Previous day</button>
            <button type="button" class="quiet-btn" id="act-next">Next day</button>
            <label>Teammate <select id="act-member"></select></label>
            <label class="act-search-label">App
              <input id="act-filter" type="search" placeholder="Cursor, Chrome, Excel…" spellcheck="false">
            </label>
          </div>
          <div class="act-apps" id="act-apps"></div>
          <p id="act-note" class="note"></p>
          <div id="activity" class="act-log"></div>
        </main>

        <main id="view-settings" hidden>
          <div class="settings-panel">
            <div class="settings-panel-title">Connection addresses</div>
            <div id="addresses"></div>
            <p id="port-note" class="note" hidden></p>
          </div>
          <div class="settings-panel">
            <div class="settings-panel-title">Live preview</div>
            <div class="settings-grid">
              <label>Preview quality
                <select id="set-live-quality">
                  <option value="low">Low — one small tile (default)</option>
                  <option value="standard">Standard</option>
                  <option value="high">High</option>
                  <option value="ultra">Ultra — sharpest</option>
                </select>
              </label>
              <label>Grid
                <select id="set-grid">
                  <option value="2x2">2 × 2</option>
                  <option value="2x3">2 × 3</option>
                  <option value="3x3">3 × 3</option>
                </select>
              </label>
            </div>
          </div>
          <div class="settings-panel">
            <div class="settings-panel-title">Screen recording</div>
            <div class="settings-grid">
              <label>Recording FPS
                <select id="set-record-fps">
                  <option value="1">1 FPS (smaller files)</option>
                  <option value="5">5 FPS</option>
                  <option value="10">10 FPS (recommended)</option>
                  <option value="15">15 FPS (smoother)</option>
                </select>
              </label>
              <label>Recording size
                <select id="set-record-width">
                  <option value="1280">720p — 1280 wide</option>
                  <option value="1920">1080p (recommended)</option>
                  <option value="2560">1440p — sharpest</option>
                </select>
              </label>
              <label>Video period
                <select id="set-segment-minutes">
                  <option value="1">1 minute</option>
                  <option value="2">2 minutes</option>
                  <option value="5">5 minutes</option>
                  <option value="10">10 minutes</option>
                </select>
              </label>
              <label>Save period
                <select id="set-retention">
                  <option value="7">7 days</option>
                  <option value="14">14 days</option>
                  <option value="30">30 days</option>
                  <option value="90">90 days</option>
                </select>
              </label>
            </div>
            <label class="settings-path-label">Save location
              <div class="settings-path-row" id="archive-dir-row">
                <input id="set-archive-dir" type="text" spellcheck="false" placeholder="Folder for recordings">
                <button type="button" class="quiet-btn" id="browse-archive">Browse</button>
                <button type="button" class="quiet-btn" id="reset-archive">App folder</button>
              </div>
            </label>
            <p class="note" id="archive-disk"></p>
            <p class="note" id="quality-note" hidden></p>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div class="pv-modal" id="previewModal">
    <button type="button" class="pv-close-fab" id="closePreviewFab" aria-label="Close">×</button>
    <div class="pv-content">
      <div class="pv-header">
        <div class="pv-title-group">
          <div class="pv-title"><span class="accent">●</span> <span id="previewTitle">Live view</span></div>
          <div class="pv-actions-main" id="display-switch"></div>
        </div>
        <div class="pv-actions-end">
          <button type="button" class="pv-btn" id="maximizePreviewBtn">Full screen</button>
          <button type="button" class="pv-btn" id="closePreviewBtn">Close</button>
        </div>
      </div>
      <div class="pv-body" id="previewBody"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
